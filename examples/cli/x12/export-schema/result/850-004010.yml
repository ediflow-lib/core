$schema: http://json-schema.org/draft-07/schema#
title: Purchase Order
description: >-
  This Draft Standard for Trial Use contains the format and establishes the data
  contents of the Purchase Order Transaction Set (850) for use within the
  context of an Electronic Data Interchange (EDI) environment. The transaction
  set can be used to provide for customary and established business and industry
  practice relative to the placement of purchase orders for goods and services.
  This transaction set should not be used to convey purchase order changes or
  purchase order acknowledgment information.
