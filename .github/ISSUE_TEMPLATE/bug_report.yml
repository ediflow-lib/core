name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🙏

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is
      placeholder: When I try to parse an ORDERS message, I get...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Install @ediflow/core
        2. Parse this EDI message: ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The message should parse successfully
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: I got an error: ...
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Sample
      description: Minimal code to reproduce (if applicable)
      placeholder: |
        ```typescript
        import { EDIFlowParser } from '@ediflow/core';
        // your code here
        ```
      render: typescript

  - type: input
    id: version
    attributes:
      label: EDIFlow Version
      description: Which version are you using?
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: What version of Node.js are you running?
      placeholder: e.g., 20.11.0
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Which package?
      description: Which EDIFlow package has the issue?
      options:
        - "@ediflow/core"
        - "@ediflow/edifact-d96a"
        - "@ediflow/edifact-d01b"
        - "@ediflow/edifact-d20b"
        - "@ediflow/edifact-d12a"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might help
      placeholder: This started happening after I upgraded from...
