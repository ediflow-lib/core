name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! 💡

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: I'd like to be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions?
      placeholder: I could also...

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe your use case
      placeholder: In my project, I need to...
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example Code (Optional)
      description: Show how you'd like to use this feature
      placeholder: |
        ```typescript
        // How I'd like to use it:
        parser.newFeature({ ... });
        ```
      render: typescript

  - type: dropdown
    id: package
    attributes:
      label: Which package?
      description: Which package should have this feature?
      options:
        - "@ediflow/core"
        - "@ediflow/edifact-d96a"
        - "@ediflow/edifact-d01b"
        - "@ediflow/edifact-d20b"
        - "@ediflow/edifact-d12a"
        - "New package"
        - "Not sure"
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to help implement this?
      options:
        - label: I'd like to implement this feature myself
        - label: I can help with testing
        - label: I can help with documentation
