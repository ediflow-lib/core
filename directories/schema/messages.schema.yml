# YAML Schema Definition für Messages
# Definiert die Struktur, wie Messages in messages/*.json gespeichert werden

type: object
properties:
  standard:
    type: string
    description: EDI Standard (z.B. "EDIFACT")
  version:
    type: string
    description: Standard version (z.B. "D.20B")
  messageType:
    type: string
    description: Message type code (z.B. "ORDERS")
  name:
    type: string
    description: Message name
  description:
    type: string
    description: Message description (optional)
  structure:
    type: array
    description: Message structure (Composite Pattern)
    items:
      oneOf:
        - type: object
          description: Segment reference
          properties:
            nodeType:
              type: string
              const: segment
            segmentRef:
              type: string
              description: Reference to segment tag from segments.json
            mandatory:
              type: boolean
            maxOccurrences:
              type: integer
              minimum: 1
            position:
              type: integer
              minimum: 1
          required:
            - nodeType
            - segmentRef
            - mandatory
            - maxOccurrences
            - position
        - type: object
          description: Segment group (composite)
          properties:
            nodeType:
              type: string
              const: segmentGroup
            id:
              type: string
              description: Segment group ID (z.B. "SG2")
            name:
              type: string
            mandatory:
              type: boolean
            maxOccurrences:
              type: integer
              minimum: 1
            position:
              type: integer
              minimum: 1
            triggerSegment:
              type: string
              description: First segment tag in group
            children:
              type: array
              description: Nested segments/groups
              items:
                $ref: "#/properties/structure/items"
          required:
            - nodeType
            - id
            - name
            - mandatory
            - maxOccurrences
            - position
            - triggerSegment
            - children
required:
  - standard
  - version
  - messageType
  - name
  - structure

example:
  standard: "EDIFACT"
  version: "D.20B"
  messageType: "ORDERS"
  name: "Purchase order message"
  description: "Message specifying details for goods or services ordered"
  structure:
    - nodeType: "segment"
      segmentRef: "UNH"
      mandatory: true
      maxOccurrences: 1
      position: 10
    - nodeType: "segment"
      segmentRef: "BGM"
      mandatory: true
      maxOccurrences: 1
      position: 20
    - nodeType: "segmentGroup"
      id: "SG2"
      name: "Name and address"
      mandatory: false
      maxOccurrences: 99
      position: 120
      triggerSegment: "NAD"
      children:
        - nodeType: "segment"
          segmentRef: "NAD"
          mandatory: true
          maxOccurrences: 1
          position: 130
