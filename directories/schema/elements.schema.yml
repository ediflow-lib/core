# YAML Schema Definition für Data Elements
# Definiert die Struktur, wie Elements in elements.json gespeichert werden

type: object
additionalProperties:
  type: object
  properties:
    code:
      type: string
      description: Element code (z.B. "0062")
    name:
      type: string
      description: Element name
    description:
      type: string
      description: Element description (optional)
    dataType:
      type: string
      enum: [a, n, an, a..n]
      description: Data type (a=alpha, n=numeric, an=alphanumeric)
    minLength:
      type: integer
      minimum: 0
      description: Minimum length (optional)
    maxLength:
      type: integer
      minimum: 1
      description: Maximum length
    codeListCode:
      type: string
      description: Reference to code list (optional)
  required:
    - code
    - name
    - dataType
    - maxLength

example:
  "0062":
    code: "0062"
    name: "Message reference number"
    description: "Unique message reference assigned by sender"
    dataType: "an"
    maxLength: 14
  "3035":
    code: "3035"
    name: "Party function code qualifier"
    dataType: "an"
    maxLength: 3
    codeListCode: "3035"
