# YAML Schema Definition für Segments
# Definiert die Struktur, wie Segments in segments.json gespeichert werden

type: object
additionalProperties:
  type: object
  properties:
    tag:
      type: string
      description: Segment tag (z.B. "UNH", "NAD")
    name:
      type: string
      description: Segment name
    description:
      type: string
      description: Segment description (optional)
    elements:
      type: array
      description: Ordered list of segment elements
      items:
        oneOf:
          - type: object
            description: Element reference
            properties:
              nodeType:
                type: string
                const: element
              elementCode:
                type: string
                description: Reference to element from elements.json
              mandatory:
                type: boolean
              position:
                type: integer
                minimum: 1
            required:
              - nodeType
              - elementCode
              - mandatory
              - position
          - type: object
            description: Composite reference
            properties:
              nodeType:
                type: string
                const: composite
              compositeCode:
                type: string
                description: Reference to composite from composites.json
              mandatory:
                type: boolean
              position:
                type: integer
                minimum: 1
            required:
              - nodeType
              - compositeCode
              - mandatory
              - position
  required:
    - tag
    - name
    - elements

example:
  "UNH":
    tag: "UNH"
    name: "Message header"
    description: "Service segment to head, identify and specify a message"
    elements:
      - nodeType: "element"
        elementCode: "0062"
        mandatory: true
        position: 1
      - nodeType: "composite"
        compositeCode: "S009"
        mandatory: true
        position: 2
  "NAD":
    tag: "NAD"
    name: "Name and address"
    description: "Specify name/address and function"
    elements:
      - nodeType: "element"
        elementCode: "3035"
        mandatory: true
        position: 1
      - nodeType: "composite"
        compositeCode: "C082"
        mandatory: false
        position: 2
