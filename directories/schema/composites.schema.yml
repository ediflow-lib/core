# YAML Schema Definition für Composite Elements
# Definiert die Struktur, wie Composites in composites.json gespeichert werden

type: object
additionalProperties:
  type: object
  properties:
    code:
      type: string
      description: Composite code (z.B. "S009")
    name:
      type: string
      description: Composite name
    description:
      type: string
      description: Composite description (optional)
    components:
      type: array
      items:
        type: object
        properties:
          elementCode:
            type: string
            description: Reference to element code from elements.json
          mandatory:
            type: boolean
            description: Whether component is mandatory
          position:
            type: integer
            minimum: 1
            description: Position within composite
        required:
          - elementCode
          - mandatory
          - position
  required:
    - code
    - name
    - components

example:
  "S009":
    code: "S009"
    name: "Message identifier"
    description: "Identifies the message type"
    components:
      - elementCode: "0065"
        mandatory: true
        position: 1
      - elementCode: "0052"
        mandatory: true
        position: 2
      - elementCode: "0054"
        mandatory: true
        position: 3
      - elementCode: "0051"
        mandatory: false
        position: 4
