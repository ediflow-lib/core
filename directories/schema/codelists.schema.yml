# YAML Schema Definition für Code Lists
# Definiert die Struktur, wie Code Lists in codelists.json gespeichert werden

type: object
additionalProperties:
  type: object
  properties:
    code:
      type: string
      description: Code list code (z.B. "3035")
    name:
      type: string
      description: Code list name
    description:
      type: string
      description: Code list description (optional)
    values:
      type: array
      items:
        type: object
        properties:
          code:
            type: string
            description: Value code
          name:
            type: string
            description: Value name
          description:
            type: string
            description: Value description (optional)
        required:
          - code
          - name
  required:
    - code
    - name
    - values

example:
  "3035":
    code: "3035"
    name: "Party function code qualifier"
    description: "Code specifying the function of a party"
    values:
      - code: "BY"
        name: "Buyer"
        description: "Party to whom merchandise or services are sold"
      - code: "SU"
        name: "Supplier"
        description: "Party who supplies goods or services"
      - code: "CN"
        name: "Consignee"
        description: "Party to which goods are consigned"
